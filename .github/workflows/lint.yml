# This workflow will check our code for having a proper format, as well as the commit message to meet the expected ones

name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the project
        run: uv sync --locked --extra lint --extra test

      - name: Cache mypy cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.1
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}
          retention-days: 30
          restore-keys: |
            mypy-${{ runner.os }}

      - name: Lint
        run: |
          uv run ruff format --check src tests eval
          uv run ruff check src tests eval 
          uv run mypy src tests eval

  lint-commit:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    name: "Lint commit message"
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install commitizen
        run: |
          python -m pip install --upgrade pip
          python -m pip install commitizen
      - name: Check commit message
        run: cz check --rev-range HEAD
